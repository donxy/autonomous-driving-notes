<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#453f36"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="336" rx="14" fill="#f7f5f0"/>
  <!-- ===== 模块化管线 ===== -->
  <text x="30" y="42" font-size="16" font-weight="700" fill="#175e63">模块化管线</text>
  <text x="150" y="42" font-size="12.5" fill="#453f36">每层接口明确：可单独调试、可验证；代价是信息损失与误差传递</text>
  <g font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="30" y="60" width="128" height="52" rx="9" fill="#175e63"/><text x="94" y="92">定位</text>
    <rect x="196" y="60" width="128" height="52" rx="9" fill="#175e63"/><text x="260" y="92">感知</text>
    <rect x="362" y="60" width="128" height="52" rx="9" fill="#175e63"/><text x="426" y="92">预测</text>
    <rect x="528" y="60" width="128" height="52" rx="9" fill="#175e63"/><text x="592" y="92">规划</text>
    <rect x="694" y="60" width="128" height="52" rx="9" fill="#175e63"/><text x="758" y="92">控制</text>
  </g>
  <g stroke="#453f36" stroke-width="2">
    <line x1="160" y1="86" x2="192" y2="86" marker-end="url(#arr)"/>
    <line x1="326" y1="86" x2="358" y2="86" marker-end="url(#arr)"/>
    <line x1="492" y1="86" x2="524" y2="86" marker-end="url(#arr)"/>
    <line x1="658" y1="86" x2="690" y2="86" marker-end="url(#arr)"/>
    <line x1="824" y1="86" x2="876" y2="86" marker-end="url(#arr)"/>
  </g>
  <text x="904" y="80" font-size="12.5" fill="#211d18">方向盘</text>
  <text x="904" y="98" font-size="12.5" fill="#211d18">油门/刹车</text>
  <g font-size="12" fill="#453f36" text-anchor="middle">
    <text x="94" y="130">我在哪</text>
    <text x="260" y="130">周围有什么</text>
    <text x="426" y="130">它们要去哪</text>
    <text x="592" y="130">我该怎么走</text>
    <text x="758" y="130">执行轨迹</text>
  </g>
  <!-- ===== 端到端 ===== -->
  <text x="30" y="196" font-size="16" font-weight="700" fill="#c26d2d">端到端</text>
  <text x="118" y="196" font-size="12.5" fill="#453f36">单一神经网络联合优化：能力上限随数据与规模走；代价是可调试性与可验证性差</text>
  <rect x="30" y="214" width="180" height="52" rx="9" fill="#e7e1d6"/>
  <text x="120" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#211d18">传感器原始输入</text>
  <line x1="214" y1="240" x2="262" y2="240" stroke="#453f36" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="268" y="214" width="330" height="52" rx="9" fill="#c26d2d"/>
  <text x="433" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">单一神经网络（数百万视频片段训练）</text>
  <line x1="602" y1="240" x2="650" y2="240" stroke="#453f36" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="656" y="214" width="180" height="52" rx="9" fill="#e7e1d6"/>
  <text x="746" y="246" text-anchor="middle" font-size="15" font-weight="700" fill="#211d18">轨迹 / 驾驶指令</text>
  <text x="433" y="292" text-anchor="middle" font-size="12" fill="#453f36">没有人工设计的中间表示 —— 现实方案多为混合式：端到端主干 + 模块化兜底</text>
  <text x="480" y="322" text-anchor="middle" font-size="12.5" fill="#453f36">争论的核心不是谁更「智能」，而是 可验证性 vs 能力上限 的取舍</text>
</svg>
