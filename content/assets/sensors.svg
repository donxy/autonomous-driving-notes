<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="960" height="330" rx="14" fill="#f7f5f0"/>
  <!-- ===== 摄像头 ===== -->
  <g>
    <path d="M160 205 L96 60 A175 175 0 0 1 224 60 Z" fill="#c26d2d" opacity="0.28"/>
    <rect x="146" y="198" width="28" height="52" rx="9" fill="#453f36"/>
    <circle cx="160" cy="196" r="5" fill="#c26d2d"/>
    <text x="160" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#211d18">摄像头</text>
    <text x="160" y="304" text-anchor="middle" font-size="12.5" fill="#453f36">看语义：车道线 / 信号灯 / 标志</text>
    <text x="160" y="34" text-anchor="middle" font-size="12.5" fill="#c26d2d" font-weight="700">深度靠算法推断</text>
  </g>
  <!-- ===== 毫米波雷达 ===== -->
  <g>
    <path d="M480 205 L392 96 A150 150 0 0 1 568 96 Z" fill="#175e63" opacity="0.25"/>
    <path d="M480 205 L428 128 A105 105 0 0 1 532 128 Z" fill="#175e63" opacity="0.18"/>
    <rect x="466" y="198" width="28" height="52" rx="9" fill="#453f36"/>
    <circle cx="480" cy="196" r="5" fill="#175e63"/>
    <text x="480" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#211d18">毫米波雷达</text>
    <text x="480" y="304" text-anchor="middle" font-size="12.5" fill="#453f36">直接测距 + 测速，全天候</text>
    <text x="480" y="34" text-anchor="middle" font-size="12.5" fill="#175e63" font-weight="700">角分辨率低、语义弱</text>
  </g>
  <!-- ===== 激光雷达 ===== -->
  <g>
    <circle cx="800" cy="196" r="118" fill="#175e63" opacity="0.13"/>
    <circle cx="800" cy="196" r="80" fill="#175e63" opacity="0.13"/>
    <circle cx="800" cy="196" r="44" fill="#175e63" opacity="0.13"/>
    <rect x="786" y="190" width="28" height="52" rx="9" fill="#453f36"/>
    <circle cx="800" cy="186" r="7" fill="#175e63"/>
    <text x="800" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#211d18">激光雷达</text>
    <text x="800" y="304" text-anchor="middle" font-size="12.5" fill="#453f36">ToF 直接测距，生成 3D 点云</text>
    <text x="800" y="34" text-anchor="middle" font-size="12.5" fill="#175e63" font-weight="700">360° 几何精确，不依赖环境光</text>
  </g>
  <text x="480" y="326" text-anchor="middle" font-size="0" fill="#453f36"></text>
</svg>
